{% extends 'master.html' %}

{% block title %}
    Fabricantes - Editar Fabricante
{% endblock %}

{% block content %}
    {% load static %}
    <p><a href="/fabricantes">Voltar</a></p>
    <h1>Editar Fabricante {{ meuFabricante.nome }}</h1>
    <form method="post">
        {% csrf_token %}
        <label for="nome">Nome do fabricante:</label>
        <input type="text" id="nome" name="nome" value="{{ meuFabricante.nome }}"><br>
        <input type="submit" value="Enviar">
    </form>
{% endblock %}
