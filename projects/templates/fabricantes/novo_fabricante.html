{% extends '../master.html' %}

{% block title %}
    Fabricante - Adicionar Fabricante
{% endblock %}

{% block content %}
    {% load static %}
    <p><a href="/fabricantes">Voltar</a></p>
    <h1>Adicionar Novo Fabricante</h1>
    <form method="post">
        {% csrf_token %}
        <label for="nome">Nome do fabricante:</label>
        <input type="text" id="nome" name="nome"><br>
        <input type="submit" value="Enviar">
    </form>
{% endblock %}
