{% extends "master.html" %}

{% block title %}
    Login - MotorMind
{% endblock %}

{% block body_class %}
    bg-white text-dark
{% endblock %}

{% block content %}
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card bg-white border-primary text-dark p-4" style="width: 380px">
            <h2 class="text-primary mb-1">MotorMind</h2>
            <p class="text-muted mb-4">Sistema de gerenciamento de Motores</p>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="matricula" class="form-label">Matricula</label>
                    <input type="text" id="matricula" name="matricula" class="form-control">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" id="password" name="password" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </div>
{% endblock %}
