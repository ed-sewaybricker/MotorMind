{% extends "master.html" %}

{% block title %}Login - MotorMind{% endblock %}

{% block body_class %}bg-white text-dark{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100 p-3">
    <div class="card border-primary p-4 w-100" style="max-width: 380px;">
        <h2 class="text-primary mb-1">MotorMind</h2>
        <p class="text-muted mb-4">Sistema de gerenciamento de Motores</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="matricula" class="form-label">Matrícula</label>
                <input type="text" id="matricula" name="matricula"
                       class="form-control" inputmode="numeric" autocomplete="username">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" id="password" name="password"
                       class="form-control" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
