{% extends "master.html" %}

{% block title %}Alterar Senha - MotorMind{% endblock %}

{% block body_class %}bg-white text-dark{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100 p-3">
    <div class="card border-primary p-4 w-100" style="max-width: 380px;">
        <h2 class="text-primary mb-1">MotorMind</h2>
        <p class="text-muted mb-4">É necessário alterar sua senha antes de continuar</p>

        <form method="post" id="formSenha">
            {% csrf_token %}
            <div class="mb-3">
                <label for="senha" class="form-label">Nova Senha</label>
                <input type="password" id="senha" name="senha" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="confirmar_senha" class="form-label">Confirmar Senha</label>
                <input type="password" id="confirmar_senha" class="form-control" required>
                <div class="form-text text-danger d-none" id="erroSenha">As senhas não coincidem</div>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="btnSalvar" disabled>
                Salvar nova senha
            </button>
        </form>
    </div>
</div>
{% endblock %}
