{% extends '../master.html' %}

{% block title %}
    TipoMotor - Adicionar Tipo
{% endblock %}

{% block content %}
    {% load static %}
    <p><a href="{% url 'tipo_motor' %}">Voltar</a></p>
    <h1>Adicionar Novo Tipo de Motor</h1>
    <form method="post">
        {% csrf_token %}
        <label for="descricao">Descrição do tipo:</label>
        <input type="text" id="descricao" name="descricao"><br>
        <input type="submit" value="Enviar">
    </form>
{% endblock %}
