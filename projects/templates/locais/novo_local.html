{% extends '../master.html' %}

{% block title %}
    Locais - Adicionar Local
{% endblock %}

{% block content %}
    {% load static %}
    <p><a href="/locais">Voltar</a></p>
    <h1>Adicionar Novo Local</h1>
    <form method="post">
        {% csrf_token %}
        <label for="nome">Nome do local:</label>
        <input type="text" id="nome" name="nome"><br>
        <input type="submit" value="Enviar">
    </form>
{% endblock %}
