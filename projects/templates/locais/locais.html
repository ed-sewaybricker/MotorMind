{% extends "../master.html" %}

{% block title %}
    MotorMind - Lista de locais
{% endblock %}

{% block content %}
    <p><a href="/">Voltar</a></p>

    <h1>Locais</h1>

    <p><a href="{% url 'novo_local' %}">Adicionar local</a></p>

    <table>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
        {% for x in meusLocais %}
            <tr>
                <th>{{ x.id_local }}</th>
                <th>{{ x.nome }}</th>
                <th><a href="{% url 'editar_local' x.id_local %}">Editar</a> <a href="{% url 'deletar_local' x.id_local %}">Deletar</a></th>
            </tr>
        {% empty %}
            <tr>
                <th>Sem locais registrados</th>
            </tr>
        {% endfor %}
    </table>
{% endblock %}
