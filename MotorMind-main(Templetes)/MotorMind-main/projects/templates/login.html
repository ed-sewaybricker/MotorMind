<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login — MotorMind</title>
</head>

<body class="bg-white text-dark">

    <div class="d-flex justify-content-center align-items-center vh-100">

        <div class="card bg-white border-primary text-dark p-4" style="width: 380px">

            <h2 class="text-primary mb-1">MotorMind</h2>
            <p class="text-muted mb-4">Sistema de gerenciamento de Motores</p>

            <form action="/login" method="post">

                <div class="mb-3">
                    <label for="matricula" class="form-label">Matricula</label>
                    <input type="number" id="matricula" name="matricula" class="form-control">
                </div>

                <div class="mb-4">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" name="senha" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary w-100">Entrar</button>

            </form>


        </div>
    </div>

</body>

</html>
